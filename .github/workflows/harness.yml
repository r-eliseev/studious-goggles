name: harness-check
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    # Локаль en_US.UTF-8 нужна, чтобы grep -E по кириллическим диапазонам
    # работал: под C.UTF-8 проверка 5 в scripts/check-docs.sh молча пропускается.
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: BASE_REF=origin/${{ github.base_ref }} bash scripts/check.sh
