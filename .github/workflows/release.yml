name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # Manual run: builds every package as workflow artifacts without creating a GitHub release (dry run before a tag).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      label: ${{ steps.v.outputs.label }}
    steps:
      - id: v
        run: |
          # Tag v1.2.3 -> version 1.2.3, label v1.2.3; manual run -> 0.0.<run>, label dev-<run>.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "label=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "label=dev-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

  avalonia:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-latest }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-latest }
          # macOS runners: the SDK ad-hoc signs the apphost only on a Mac, and osx-arm64 does not start unsigned.
          - { rid: osx-x64, os: macos-latest }
          - { rid: osx-arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      ASSET: ImageGen-Avalonia-${{ needs.version.outputs.label }}-${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish Avalonia desktop
        shell: bash
        run: dotnet publish ImageGen/ImageGen.Avalonia/ImageGen.Avalonia.csproj -c Release -r ${{ matrix.rid }} --self-contained -p:Version=${{ needs.version.outputs.version }} -o publish/${{ matrix.rid }}
      - name: Pack
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          case "${{ matrix.rid }}" in
            win-*) 7z a -tzip "../../$ASSET.zip" . ;;
            *) tar -czf "../../$ASSET.tar.gz" . ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}.*

  maui-windows:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    runs-on: windows-latest
    env:
      ASSET: ImageGen-Maui-${{ needs.version.outputs.label }}-${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-windows
      # Global TargetFrameworks narrows restore and publish to Windows, so -r does not reach Android (NU1102 Mono.win-x64). RuntimeIdentifierOverride was ignored: win-arm64 got x64 binaries.
      - name: Publish MAUI Windows (unpackaged, self-contained)
        shell: bash
        run: >-
          dotnet publish ImageGen/ImageGen.Maui/ImageGen.Maui.csproj -c Release
          -f net10.0-windows10.0.19041.0 -p:TargetFrameworks=net10.0-windows10.0.19041.0 -r ${{ matrix.rid }} -p:SelfContained=true
          -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          -p:ApplicationDisplayVersion=${{ needs.version.outputs.version }} -p:ApplicationVersion=${{ github.run_number }}
          -o publish/${{ matrix.rid }}
      # Fail if the published binaries are not built for the matrix RID (v0.1.4 shipped x64 binaries as win-arm64).
      - name: Check PE machine
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
        run: |
          $expectedMachine = switch ($env:RID) {
            'win-x64' { 0x8664; break }
            'win-arm64' { 0xAA64; break }
            default { Write-Output "Unsupported RID: $env:RID"; exit 1 }
          }
          $failed = $false
          $files = @('ImageGen.Maui.exe', 'coreclr.dll', 'Microsoft.WindowsAppRuntime.Bootstrap.dll')
          foreach ($file in $files) {
            $path = Join-Path "publish/$env:RID" $file
            try {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw 'file is missing'
              }
              $bytes = [System.IO.File]::ReadAllBytes($path)
              if ($bytes.Length -lt 0x40 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
                throw 'file is too short or has no MZ signature'
              }
              $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
              if ($peOffset -lt 0x40 -or $peOffset -gt ($bytes.Length - 6)) {
                throw 'PE header offset is out of bounds'
              }
              if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45 -or
                  $bytes[$peOffset + 2] -ne 0 -or $bytes[$peOffset + 3] -ne 0) {
                throw 'PE signature is invalid'
              }
              $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
              Write-Output ("{0}: 0x{1:X4}" -f $file, $machine)
              if ($machine -ne $expectedMachine) {
                Write-Output ("{0}: machine 0x{1:X4}, expected 0x{2:X4} for {3}" -f $file, $machine, $expectedMachine, $env:RID)
                $failed = $true
              }
            }
            catch {
              Write-Output ("{0}: PE check failed: {1}" -f $file, $_.Exception.Message)
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Pack
        shell: bash
        run: cd publish/${{ matrix.rid }} && 7z a -tzip "../../$ASSET.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}.zip

  # Android on Windows, as in build.yml: installing maui-android on ubuntu-latest ran out of disk.
  maui-android:
    needs: version
    runs-on: windows-latest
    env:
      ASSET: ImageGen-Maui-${{ needs.version.outputs.label }}-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-android
      # No release keystore yet: the APK is signed with the build's debug key (installable by sideloading, not for a store).
      - name: Publish MAUI Android (APK)
        shell: bash
        run: >-
          dotnet publish ImageGen/ImageGen.Maui/ImageGen.Maui.csproj -c Release -f net10.0-android
          -p:AndroidPackageFormat=apk
          -p:ApplicationDisplayVersion=${{ needs.version.outputs.version }} -p:ApplicationVersion=${{ github.run_number }}
          -o publish/android
      - name: Pack
        shell: bash
        run: cp publish/android/*-Signed.apk "$ASSET.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}.apk

  # MAUI Mac Catalyst and iOS are not published (owner's decision 2026-10-29). The current maui workload
  # (Mac Catalyst SDK 27.0) needs Xcode 27.1; GitHub runners macos-latest and macos-26 have Xcode 26.x only.
  # Mac users get the Avalonia osx-x64 / osx-arm64 packages. iOS would also need an Apple certificate.

  publish:
    if: github.ref_type == 'tag'
    needs: [avalonia, maui-windows, maui-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Release notes
        run: |
          # Tasks done since the previous vX.Y.Z tag (scripts/release-notes.sh).
          bash scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --title "ImageGen $GITHUB_REF_NAME" --notes-file notes.md
