name: ui-e2e

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ui-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-android
      - name: Publish Android APK
        shell: bash
        run: dotnet publish ImageGen/ImageGen.Maui/ImageGen.Maui.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk -o publish/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: publish/android/*-Signed.apk
          if-no-files-found: error
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet workload install maui-windows
      - name: Publish unpackaged Windows app
        shell: bash
        run: >-
          dotnet publish ImageGen/ImageGen.Maui/ImageGen.Maui.csproj -c Release
          -f net10.0-windows10.0.19041.0 -p:ImageGenWindowsRid=win-x64 -p:SelfContained=true
          -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -o publish/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 14

  test-android:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: publish/android
      - name: Build E2E mock provider
        run: dotnet build ImageGen/ImageGen.E2E.MockProvider/ImageGen.E2E.MockProvider.csproj -c Release
      - name: Create one-off HTTPS certificates for the mock provider
        shell: bash
        run: |
          set -euo pipefail
          tls_dir="$RUNNER_TEMP/e2e-mock-tls"
          mkdir -p "$tls_dir" reports/android/mock-provider
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 2 \
            -keyout "$tls_dir/root-ca.key" -out "$tls_dir/root-ca.pem" \
            -subj "/CN=Omnilite E2E Mock Root" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -newkey rsa:2048 -nodes \
            -keyout "$tls_dir/mock-server.key" -out "$tls_dir/mock-server.csr" \
            -subj "/CN=localhost"
          cat > "$tls_dir/mock-server.ext" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:localhost
          EOF
          openssl x509 -req -sha256 -days 2 \
            -in "$tls_dir/mock-server.csr" \
            -CA "$tls_dir/root-ca.pem" -CAkey "$tls_dir/root-ca.key" -CAcreateserial \
            -out "$tls_dir/mock-server.pem" -extfile "$tls_dir/mock-server.ext"
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          openssl pkcs12 -export -out "$tls_dir/mock-server.pfx" \
            -inkey "$tls_dir/mock-server.key" -in "$tls_dir/mock-server.pem" \
            -certfile "$tls_dir/root-ca.pem" -passout "pass:$password"
          {
            echo "E2E_CA_CERT=$tls_dir/root-ca.pem"
            echo "Kestrel__Certificates__Default__Path=$tls_dir/mock-server.pfx"
            echo "Kestrel__Certificates__Default__Password=$password"
          } >> "$GITHUB_ENV"
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Appium and UIAutomator2 driver
        run: |
          mkdir -p reports/android
          npm install -g appium@3.9.0
          appium driver install uiautomator2@8.7.3
      - name: Start Appium server
        run: |
          appium --log reports/android/appium.log &
          for attempt in $(seq 1 120); do
            if curl --silent --fail http://127.0.0.1:4723/status >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat reports/android/appium.log
          exit 1
      - name: Start emulator, run preflight and UI tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_REPORTS_DIR: ${{ github.workspace }}/reports/android
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          emulator-options: -writable-system -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash ImageGen/ImageGen.E2E.Common/ci/android-mock-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-e2e
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  test-windows:
    needs: build-windows
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: publish/win-x64
      - name: Build E2E mock provider
        run: dotnet build ImageGen/ImageGen.E2E.MockProvider/ImageGen.E2E.MockProvider.csproj -c Release
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Run Windows interactive preflight
        shell: pwsh
        run: .\ImageGen\ImageGen.E2E.Common\ci\windows-preflight.ps1
      - name: Create and trust one-off HTTPS certificate
        shell: pwsh
        run: |
          $tlsDirectory = Join-Path $env:RUNNER_TEMP 'e2e-mock-tls'
          New-Item -ItemType Directory -Force -Path $tlsDirectory, 'reports/windows/mock-provider' | Out-Null
          $certificate = New-SelfSignedCertificate `
            -DnsName 'localhost' `
            -CertStoreLocation 'Cert:\LocalMachine\My' `
            -FriendlyName 'Omnilite E2E Mock' `
            -NotAfter (Get-Date).AddDays(2) `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature, KeyEncipherment `
            -Type SSLServerAuthentication
          $certificatePath = Join-Path $tlsDirectory 'mock-server.cer'
          $certificateFile = Export-Certificate -Cert $certificate -FilePath $certificatePath
          Import-Certificate -FilePath $certificateFile.FullName -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
          $password = [guid]::NewGuid().ToString('N')
          Write-Output "::add-mask::$password"
          $securePassword = ConvertTo-SecureString -String $password -Force -AsPlainText
          $pfxPath = Join-Path $tlsDirectory 'mock-server.pfx'
          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword | Out-Null
          "Kestrel__Certificates__Default__Path=$pfxPath" >> $env:GITHUB_ENV
          "Kestrel__Certificates__Default__Password=$password" >> $env:GITHUB_ENV
      - name: Run Windows UI tests
        shell: pwsh
        env:
          APP_EXE: ${{ github.workspace }}\publish\win-x64\ImageGen.Maui.exe
          E2E_REPORTS_DIR: ${{ github.workspace }}\reports\windows
          E2E_PROVIDER_CONFIG: ${{ github.workspace }}\ImageGen\ImageGen.E2E.Common\e2e-providers.json
        run: |
          New-Item -ItemType Directory -Force -Path reports/windows/allure-results | Out-Null
          $mockLog = Join-Path $env:GITHUB_WORKSPACE 'reports/windows/mock-provider/mock-provider.log'
          $mockError = Join-Path $env:GITHUB_WORKSPACE 'reports/windows/mock-provider/mock-provider-error.log'
          $mockDll = Join-Path $env:GITHUB_WORKSPACE 'ImageGen/ImageGen.E2E.MockProvider/bin/Release/net10.0/ImageGen.E2E.MockProvider.dll'
          $mock = Start-Process dotnet -ArgumentList @($mockDll, '--urls', 'https://0.0.0.0:5443') -PassThru -RedirectStandardOutput $mockLog -RedirectStandardError $mockError
          try {
            $ready = $false
            $lastHealthError = 'The mock process has not answered yet.'
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              if ($mock.HasExited) {
                $lastHealthError = "The mock process exited with code $($mock.ExitCode)."
                break
              }
              try {
                $status = & curl.exe --silent --show-error --fail --max-time 5 --output NUL --write-out '%{http_code}' --header 'Authorization: Bearer e2e-mock-key' 'https://localhost:5443/v1/models'
                if ($LASTEXITCODE -eq 0 -and $status -eq '200') { $ready = $true; break }
                $lastHealthError = "curl exited with code $LASTEXITCODE and HTTP status '$status'."
              }
              catch { $lastHealthError = $_.Exception.Message }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              Get-Content $mockLog, $mockError -ErrorAction SilentlyContinue
              throw "The HTTPS E2E mock provider did not become ready: $lastHealthError"
            }
            dotnet test --project ImageGen/ImageGen.E2E.Windows/ImageGen.E2E.Windows.csproj --report-trx --results-directory reports/windows
          }
          finally {
            if (-not $mock.HasExited) { Stop-Process -Id $mock.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e
          path: reports/
          if-no-files-found: warn
          retention-days: 14

  report:
    needs: [test-android, test-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-e2e
          path: reports/download/android
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-e2e
          path: reports/download/windows
      - name: Merge Allure results and summarize platforms
        id: collect
        run: |
          bash ImageGen/ImageGen.E2E.Common/ci/allure-summary.sh reports/download reports/allure-results
          if find reports/allure-results -type f -name '*-result.json' -print -quit | grep -q .; then
            echo 'has-results=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has-results=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.collect.outputs.has-results == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate Allure HTML report
        if: steps.collect.outputs.has-results == 'true'
        run: npx --yes allure-commandline@2.46.1 generate reports/allure-results --clean -o reports/allure-html
      - uses: actions/upload-artifact@v4
        if: always() && steps.collect.outputs.has-results == 'true'
        with:
          name: allure-report
          path: reports/allure-html
          if-no-files-found: warn
          retention-days: 14

  preflight-windows:
    needs: build-windows
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-app
          path: publish/win-x64
      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress
      - name: Run Windows interactive preflight
        if: always()
        shell: pwsh
        run: .\ImageGen\ImageGen.E2E.Common\ci\windows-preflight.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preflight-windows-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
